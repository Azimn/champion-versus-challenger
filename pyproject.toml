[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvc-research"
version = "0.1.0"
description = "Architecture-neutral qualification harness for Champion versus Challenger character-simulation research"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cvc-validate-trace = "cvc_research.cli:validate_trace_main"
cvc-validate-state = "cvc_research.cli:validate_state_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
