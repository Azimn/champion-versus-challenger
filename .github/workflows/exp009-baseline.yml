name: exp009-baseline

on:
  push:
    branches:
      - exp009-unfinished-concern-persistence
    paths:
      - "src/lifelike_min/exp009_baseline.py"
      - ".github/workflows/exp009-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen champion production files are unchanged
        run: |
          git diff --exit-code 2856ec6a32be0347a9243f6eff6faa404a9a0e6c -- \
            src/lifelike_min/v9_1_compact.py \
            src/lifelike_min/v9_compact.py \
            src/lifelike_min/exp004_challenger.py \
            src/lifelike_min/exp005_challenger.py \
            src/lifelike_min/exp006_challenger.py \
            src/lifelike_min/exp007_challenger.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run frozen baseline reconstruction
        env:
          PYTHONPATH: src
        run: |
          mkdir -p results/exp009-baseline
          python -m lifelike_min.exp009_baseline --json results/exp009-baseline/baseline.json
      - name: Preserve baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: exp009-baseline
          path: results/exp009-baseline
          if-no-files-found: error
