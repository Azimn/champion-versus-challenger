name: exp013-attractor-diagnosis
on:
  push:
    branches:
      - exp013-diagnostic-period-six
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: test "$(git hash-object src/lifelike_min/exp012_challenger.py)" = "9c6474de1918b62e827d32deff2fa10a4b2443d1"
      - run: pytest -q
      - run: python -m lifelike_min.exp013_attractor_diagnosis --json results/exp013/diagnosis.json
      - uses: actions/upload-artifact@v4
        with:
          name: exp013-attractor-diagnosis
          path: results/exp013/*.json
