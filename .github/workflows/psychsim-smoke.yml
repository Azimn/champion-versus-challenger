name: psychsim-smoke

on:
  push:
    paths:
      - "qualification/psychsim_native_tom.py"
      - ".github/workflows/psychsim-smoke.yml"
  pull_request:
    paths:
      - "qualification/psychsim_native_tom.py"
      - ".github/workflows/psychsim-smoke.yml"

permissions:
  contents: read

jobs:
  native-theory-of-mind-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research workspace
        uses: actions/checkout@v4

      - name: Check out pinned PsychSim
        uses: actions/checkout@v4
        with:
          repository: pynadath/psychsim
          ref: c7b2b92e6ff8b83b2e832acda02c4baafabdf06f
          path: external/psychsim

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Preserve original shipped test result
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/external/psychsim" \
            python -m unittest \
            psychsim.test.tomjerry.TestAgents.testRewardModels -v \
            2>&1 | tee psychsim-original-test.txt

      - name: Execute native Theory of Mind compatibility reconstruction
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/external/psychsim" \
            python qualification/psychsim_native_tom.py \
            2>&1 | tee psychsim-reconstruction.txt

      - name: Preserve qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: psychsim-native-theory-of-mind-smoke
          path: |
            psychsim-original-test.txt
            psychsim-reconstruction.txt
            qualification-results/psychsim-native-tom.json
          if-no-files-found: error
