name: exp009-closeout

on:
  push:
    branches:
      - exp009-unfinished-concern-persistence
    paths:
      - "src/lifelike_min/exp009_closeout.py"
      - ".github/workflows/exp009-closeout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen v9.1 production ancestors unchanged
        run: |
          git diff --exit-code 2856ec6a32be0347a9243f6eff6faa404a9a0e6c -- \
            src/lifelike_min/v9_1_compact.py \
            src/lifelike_min/v9_compact.py \
            src/lifelike_min/exp004_challenger.py \
            src/lifelike_min/exp005_challenger.py \
            src/lifelike_min/exp006_challenger.py \
            src/lifelike_min/exp007_challenger.py
      - name: Verify EXP-009 production stayed frozen
        run: git diff --exit-code b5cc3e109ab2fa4de0421dc113009d1ee7fb050d -- src/lifelike_min/exp009_challenger.py
      - name: Verify both reviewer generations stayed frozen
        run: |
          git diff --exit-code 7434e8dcdb8de7097a57eec70dbff4faa61ff197 -- src/lifelike_min/exp009_review1.py
          git diff --exit-code 9211d3fa824bafd50c658cd4d22d27d09e133f32 -- src/lifelike_min/exp009_review2.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay full repository test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run strict EXP-009 closeout
        env:
          PYTHONPATH: src
        run: |
          mkdir -p results/exp009-closeout
          python -m lifelike_min.exp009_closeout --json results/exp009-closeout/closeout.json
      - name: Preserve closeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp009-closeout
          path: results/exp009-closeout
          if-no-files-found: warn
