name: exp009-review1-adjudication

on:
  push:
    branches:
      - exp009-unfinished-concern-persistence
    paths:
      - "src/lifelike_min/exp009_review1_adjudication.py"
      - ".github/workflows/exp009-review1-adjudication.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen EXP-009 production implementation
        run: git diff --exit-code b5cc3e109ab2fa4de0421dc113009d1ee7fb050d -- src/lifelike_min/exp009_challenger.py
      - name: Verify original reviewer remains unchanged
        run: git diff --exit-code 7434e8dcdb8de7097a57eec70dbff4faa61ff197 -- src/lifelike_min/exp009_review1.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay untouched reviewer for preserved raw result
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          mkdir -p results/exp009-review1-adjudication
          python -m lifelike_min.exp009_review1 --json results/exp009-review1-adjudication/raw-review1.json
      - name: Run classified numerical adjudication
        env:
          PYTHONPATH: src
        run: python -m lifelike_min.exp009_review1_adjudication --json results/exp009-review1-adjudication/adjudication.json
      - name: Preserve adjudication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp009-review1-adjudication
          path: results/exp009-review1-adjudication
          if-no-files-found: error
