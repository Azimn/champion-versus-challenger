name: exp003-adversarial-audit

on:
  push:
    branches:
      - exp003-adversarial-audit
    paths:
      - "src/lifelike_min/exp003_*.py"
      - "tests/test_exp003.py"
      - ".github/workflows/exp003-audit.yml"
  pull_request:
    paths:
      - "src/lifelike_min/exp003_*.py"
      - "tests/test_exp003.py"
      - ".github/workflows/exp003-audit.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run frozen champion audit
        env:
          PYTHONPATH: src
        run: |
          mkdir -p results/exp003
          python -m lifelike_min.exp003_audit --json results/exp003/audit.json

      - name: Run causal and reviewer tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_exp003 -v

      - name: Run matched champion challenger evaluation
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: |
          python -m lifelike_min.exp003_evaluation \
            --json results/exp003/report.json \
            --compact-json results/exp003/report-compact.json

      - name: Preserve EXP-003 evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: exp003-results
          path: results/exp003
          if-no-files-found: error
