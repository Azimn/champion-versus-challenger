name: post-v9-3-revalidation
on:
  push:
    branches: [post-v9-3-failure-revalidation]
    paths: ['src/lifelike_min/post_v9_3_revalidation.py','.github/workflows/post-v9-3-revalidation.yml']
  workflow_dispatch:
jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify frozen champion production bytes
        run: test "$(git show 03baf6bc6f06d3f298701a8ce66c44e00f509d50:src/lifelike_min/exp010_challenger.py | sha256sum | cut -d' ' -f1)" = "$(sha256sum src/lifelike_min/exp010_challenger.py | cut -d' ' -f1)"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e . pytest
      - run: pytest -q
      - run: python -m lifelike_min.exp010_closeout
      - run: python -m lifelike_min.post_v9_3_revalidation --json results/post-v9-3/revalidation.json
      - uses: actions/upload-artifact@v4
        with: {name: post-v9-3-revalidation, path: results/post-v9-3/}
