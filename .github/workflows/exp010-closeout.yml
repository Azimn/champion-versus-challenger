name: exp010-closeout
on:
  push:
    branches: [exp010-minimum-information-suppression]
    paths:
      - 'src/lifelike_min/exp010_closeout.py'
      - '.github/workflows/exp010-closeout.yml'
  workflow_dispatch:
jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify production frozen
        run: test "$(git show 03baf6bc6f06d3f298701a8ce66c44e00f509d50:src/lifelike_min/exp010_challenger.py | sha256sum | cut -d' ' -f1)" = "$(sha256sum src/lifelike_min/exp010_challenger.py | cut -d' ' -f1)"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e . pytest
      - name: Complete repository regression
        run: pytest -q
      - name: Replay EXP-007 adversarial generations
        run: |
          python -m lifelike_min.exp007_review
          python -m lifelike_min.exp007_review2
          python -m lifelike_min.exp007_review3
      - name: Replay EXP-009 strict closeout
        run: python -m lifelike_min.exp009_closeout_v2
      - name: Replay EXP-010 development
        run: python -m lifelike_min.exp010_evaluation --json results/exp010-closeout/development.json
      - name: Replay reviewer generation 1 unchanged
        run: python -m lifelike_min.exp010_review1 --json results/exp010-closeout/review1.json
      - name: Replay reviewer generation 2 unchanged
        run: python -m lifelike_min.exp010_review2 --json results/exp010-closeout/review2.json
      - name: Strict decision, second-order critique, and cost audit
        run: python -m lifelike_min.exp010_closeout --json results/exp010-closeout/closeout.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp010-closeout
          path: results/exp010-closeout/
