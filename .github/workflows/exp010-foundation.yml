name: exp010-foundation

on:
  push:
    branches:
      - exp010-minimum-information-suppression
    paths:
      - "src/lifelike_min/exp010_foundation.py"
      - ".github/workflows/exp010-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen v9.2 production unchanged
        run: |
          test "$(git merge-base HEAD bd1ca22ca58e82012f1a8237e3de4bfee4dbf59d)" = "bd1ca22ca58e82012f1a8237e3de4bfee4dbf59d"
          git diff --exit-code bd1ca22ca58e82012f1a8237e3de4bfee4dbf59d -- \
            src/lifelike_min/exp009_challenger.py \
            src/lifelike_min/v9_1_compact.py \
            src/lifelike_min/v9_compact.py \
            src/lifelike_min/exp004_challenger.py \
            src/lifelike_min/exp005_challenger.py \
            src/lifelike_min/exp006_challenger.py \
            src/lifelike_min/exp007_challenger.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run complete repository tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Replay strict v9.2 earned contract
        env:
          PYTHONPATH: src
        run: python -m lifelike_min.exp009_closeout_v2 --json results/exp010-foundation/v9-2-closeout.json
      - name: Run pre-archaeology information-loss foundation
        env:
          PYTHONPATH: src
        run: python -m lifelike_min.exp010_foundation --json results/exp010-foundation/foundation.json
      - name: Preserve foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp010-foundation
          path: results/exp010-foundation
          if-no-files-found: warn
