name: selected-failure-characterization

on:
  push:
    branches:
      - post-v9-1-failure-discovery
    paths:
      - "src/lifelike_min/failure_characterization_search.py"
      - ".github/workflows/selected-failure-characterization.yml"

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run selected failure characterization
        env:
          PYTHONPATH: src
        run: |
          mkdir -p results/selected-failure-characterization
          python -m lifelike_min.failure_characterization_search --json results/selected-failure-characterization/search-failure.json
      - name: Preserve characterization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-failure-characterization
          path: results/selected-failure-characterization/search-failure.json
          if-no-files-found: warn
