name: pema-developmental-scientific

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact PEMA implementation SHA approved for this canonical execution
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pema-developmental-world-scientific
  cancel-in-progress: false

env:
  EXPECTED_APPROVED_SHA: 0bfe775ae712803d948f9897c12c072bfbe80461

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Require exact approved scientific SHA
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.approved_sha }}" = "${EXPECTED_APPROVED_SHA}" || {
            echo "Refusing execution: approved_sha must be ${EXPECTED_APPROVED_SHA}" >&2
            exit 1
          }

      - name: Refuse duplicate canonical execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          prior_successes="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/pema-developmental-scientific.yml/runs?event=workflow_dispatch&status=success&per_page=100" \
            --jq '.workflow_runs[] | select((.id | tostring) != env.CURRENT_RUN_ID) | .id')"
          if [ -n "${prior_successes}" ]; then
            echo "Refusing duplicate canonical execution. A successful canonical PEMA developmental run already exists: ${prior_successes}" >&2
            exit 1
          fi

      - name: Check out exact approved scientific commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen harness
        run: python -m pip install -e .

      - name: Re-run deterministic gates on approved SHA
        run: |
          python -m unittest discover -s tests -v
          cvc-validate-state .

      - name: Verify checked-out scientific SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.approved_sha }}"

      - name: Execute preregistered PEMA developmental experiment
        run: |
          python research/experiments/pema-developmental-world/run_scientific.py \
            --output artifacts/pema-developmental-world

      - name: Record immutable artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/pema-developmental-world
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload complete scientific artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pema-developmental-world-${{ inputs.approved_sha }}-${{ github.run_id }}
          path: artifacts/pema-developmental-world/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
