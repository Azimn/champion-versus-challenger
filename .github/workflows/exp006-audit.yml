name: exp006-adversarial-audit

on:
  push:
    branches:
      - exp006-adversarial-audit
    paths:
      - "src/lifelike_min/exp006_*.py"
      - "tests/test_exp006.py"
      - ".github/workflows/exp006-audit.yml"
  pull_request:
    paths:
      - "src/lifelike_min/exp006_*.py"
      - "tests/test_exp006.py"
      - ".github/workflows/exp006-audit.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run frozen v7 audit
        env:
          PYTHONPATH: src
        run: |
          mkdir -p results/exp006
          python -m lifelike_min.exp006_audit --json results/exp006/audit.json

      - name: Run causal and reviewer tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_exp006 -v

      - name: Run matched champion challenger evaluation
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: |
          python -m lifelike_min.exp006_evaluation \
            --json results/exp006/report.json \
            --compact-json results/exp006/report-compact.json

      - name: Preserve EXP-006 evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: exp006-results
          path: results/exp006
          if-no-files-found: error
