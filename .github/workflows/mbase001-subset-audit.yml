name: mbase001-subset-audit
on:
  push:
    branches: [mbase-001-mechanism-basis-audit]
    paths:
      - 'src/lifelike_min/mbase001_audit.py'
      - 'research/audits/MBASE001_*'
      - '.github/workflows/mbase001-subset-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen production ancestor unchanged
        run: |
          test "$(git show 03baf6bc6f06d3f298701a8ce66c44e00f509d50:src/lifelike_min/exp010_challenger.py | sha256sum | cut -d' ' -f1)" = "$(sha256sum src/lifelike_min/exp010_challenger.py | cut -d' ' -f1)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest
      - name: Full frozen regression contract
        run: pytest -q
      - name: Exhaustive 2048-subset audit
        run: python -m lifelike_min.mbase001_audit --json results/mbase-001/subsets.json
      - uses: actions/upload-artifact@v4
        with:
          name: mbase001-subsets
          path: results/mbase-001/subsets.json
