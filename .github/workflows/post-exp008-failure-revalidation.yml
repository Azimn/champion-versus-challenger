name: post-exp008-failure-revalidation

on:
  push:
    branches:
      - post-exp008-failure-revalidation
    paths:
      - "src/lifelike_min/post_exp008_failure_revalidation.py"
      - ".github/workflows/post-exp008-failure-revalidation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen champion production is unchanged
        run: |
          git diff --exit-code 2856ec6a32be0347a9243f6eff6faa404a9a0e6c -- src/lifelike_min/v9_1_compact.py src/lifelike_min/runtime.py src/lifelike_min/exp007_challenger.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen champion structural contract
        env:
          PYTHONPATH: src
        run: python -m lifelike_min.v9_1_structural_closeout_v2 --json /tmp/v9_1_closeout.json
      - name: Revalidate remaining six failures
        env:
          PYTHONPATH: src
        run: |
          mkdir -p results/post-exp008
          python -m lifelike_min.post_exp008_failure_revalidation --json results/post-exp008/revalidation.json
      - name: Preserve queue evidence
        uses: actions/upload-artifact@v4
        with:
          name: post-exp008-failure-revalidation
          path: results/post-exp008/revalidation.json
          if-no-files-found: error
