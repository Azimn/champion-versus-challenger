name: exp005-prospective-cue

on:
  push:
    branches:
      - exp005-prospective-cue
    paths:
      - "src/lifelike_min/exp005_*.py"
      - "tests/test_exp005.py"
      - ".github/workflows/exp005-prospective-cue.yml"
  pull_request:
    paths:
      - "src/lifelike_min/exp005_*.py"
      - "tests/test_exp005.py"
      - ".github/workflows/exp005-prospective-cue.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run causal and reviewer tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_exp005 -v

      - name: Run matched champion challenger evaluation
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: |
          mkdir -p results/exp005
          python -m lifelike_min.exp005_evaluation \
            --json results/exp005/report.json \
            --compact-json results/exp005/report-compact.json

      - name: Preserve EXP-005 evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: exp005-results
          path: results/exp005
          if-no-files-found: error
