name: exp008-review1

on:
  push:
    branches:
      - exp008-search-experience-policy
    paths:
      - "src/lifelike_min/exp008_review1.py"
      - ".github/workflows/exp008-review1.yml"

permissions:
  contents: read

jobs:
  reviewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run post-freeze reviewer generation 1
        env:
          PYTHONPATH: src
        run: |
          mkdir -p results/exp008-review1
          python -m lifelike_min.exp008_review1 --json results/exp008-review1/review1.json
      - name: Preserve reviewer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp008-review1
          path: results/exp008-review1/review1.json
          if-no-files-found: warn
