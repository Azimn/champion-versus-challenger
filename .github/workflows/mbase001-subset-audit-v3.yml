name: mbase001-subset-audit-v3
on:
  push:
    branches: [mbase-001-mechanism-basis-audit]
    paths: ['src/lifelike_min/mbase001_audit_v3.py','.github/workflows/mbase001-subset-audit-v3.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e . pytest
      - run: pytest -q
      - run: python -m lifelike_min.mbase001_audit_v3 --json results/mbase-001/subsets-v3.json
      - uses: actions/upload-artifact@v4
        with: {name: mbase001-subsets-v3, path: results/mbase-001/subsets-v3.json}
