name: exp011-development
on:
  push:
    branches: [exp011-prospective-capacity]
    paths:
      - 'src/lifelike_min/exp011_challenger.py'
      - 'src/lifelike_min/exp011_evaluation.py'
      - '.github/workflows/exp011-development.yml'
permissions: {contents: read}
jobs:
  evaluate:
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: pip install -e . pytest
      - run: pytest -q
      - run: python -m lifelike_min.exp011_evaluation --json results/exp011/development-${{ matrix.python-version }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: exp011-development-${{ matrix.python-version }}
          path: results/exp011/development-${{ matrix.python-version }}.json
