name: global-ablation-v9

on:
  push:
    branches:
      - global-structural-ablation-v9
    paths:
      - "src/lifelike_min/global_ablation_v9*.py"
      - "src/lifelike_min/global_consolidation_v9*.py"
      - "src/lifelike_min/v9_compact*.py"
      - "research/experiments/GLOBAL_ABLATION_V9.md"
      - "research/results/GLOBAL_ABLATION_V9*.json"
      - ".github/workflows/global-ablation-v9.yml"
  pull_request:
    paths:
      - "src/lifelike_min/global_ablation_v9*.py"
      - "src/lifelike_min/global_consolidation_v9*.py"
      - "src/lifelike_min/v9_compact*.py"
      - "research/experiments/GLOBAL_ABLATION_V9.md"
      - "research/results/GLOBAL_ABLATION_V9*.json"
      - ".github/workflows/global-ablation-v9.yml"

permissions:
  contents: read

jobs:
  structural-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify unchanged frozen-v9 regression suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run global structural ablation tournament
        env:
          PYTHONPATH: src
        run: |
          mkdir -p results/global-ablation-v9
          python -m lifelike_min.global_ablation_v9 --json results/global-ablation-v9/pass1.json
      - name: Run adversarial review of H1 and H2
        env:
          PYTHONPATH: src
        run: |
          python -m lifelike_min.global_ablation_v9_review --json results/global-ablation-v9/h1-h2-review.json
      - name: Run post-freeze architectural compaction review
        env:
          PYTHONPATH: src
        run: |
          python -m lifelike_min.v9_compact_review --json results/global-ablation-v9/compact-review.json
      - name: Run corrected pairwise consolidation experiments
        env:
          PYTHONPATH: src
        run: |
          python -m lifelike_min.global_consolidation_v9_v2 --json results/global-ablation-v9/pairwise-consolidation.json
      - name: Run concern and prospective capacity tournament
        env:
          PYTHONPATH: src
        run: |
          python -m lifelike_min.v9_compact_capacity --json results/global-ablation-v9/capacity-tournament.json
      - name: Preserve global ablation evidence
        uses: actions/upload-artifact@v4
        with:
          name: global-ablation-v9-full-review
          path: results/global-ablation-v9
          if-no-files-found: error
