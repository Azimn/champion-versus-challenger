name: exp009-review2

on:
  push:
    branches:
      - exp009-unfinished-concern-persistence
    paths:
      - "src/lifelike_min/exp009_review2.py"
      - ".github/workflows/exp009-review2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen EXP-009 production implementation
        run: git diff --exit-code b5cc3e109ab2fa4de0421dc113009d1ee7fb050d -- src/lifelike_min/exp009_challenger.py
      - name: Verify reviewer 1 remains unchanged
        run: git diff --exit-code 7434e8dcdb8de7097a57eec70dbff4faa61ff197 -- src/lifelike_min/exp009_review1.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run independent reviewer generation 2
        env:
          PYTHONPATH: src
        run: |
          mkdir -p results/exp009-review2
          python -m lifelike_min.exp009_review2 --json results/exp009-review2/review2.json
      - name: Preserve reviewer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp009-review2
          path: results/exp009-review2
          if-no-files-found: warn
