name: exp010-review2
on:
  push:
    branches: [exp010-minimum-information-suppression]
    paths:
      - 'src/lifelike_min/exp010_review2.py'
      - '.github/workflows/exp010-review2.yml'
  workflow_dispatch:
jobs:
  review2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify production frozen
        run: test "$(git show 03baf6bc6f06d3f298701a8ce66c44e00f509d50:src/lifelike_min/exp010_challenger.py | sha256sum | cut -d' ' -f1)" = "$(sha256sum src/lifelike_min/exp010_challenger.py | cut -d' ' -f1)"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e .
      - run: python -m lifelike_min.exp010_review2 --json results/exp010-review2/review2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp010-review2
          path: results/exp010-review2/
